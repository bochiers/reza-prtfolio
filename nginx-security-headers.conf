# Included from every location that sets its own add_header.
# (nginx drops inherited add_header directives as soon as a location defines
#  one of its own, so the headers live in a snippet instead of the server block.)
#
# CSP decisions (also documented in docs/DEPLOY.md). User decision 2026-11-20: no external media.
#  - Every directive is 'self' only: no third-party origin is allowed (no cloudfront, no Google Fonts,
#    no Unsplash hotlink). Fonts are self-hosted in /fonts/, photos go in /img/.
#  - script-src 'self'        : no inline script. JSON-LD (<script type="application/ld+json">)
#                               is a data block, not executed, so CSP does not apply to it.
#                               If frontend ever needs an inline executable script, add a sha256 hash
#                               here; do NOT use 'unsafe-inline' for scripts.
#  - style-src 'unsafe-inline': framer-motion writes inline style attributes at runtime.
#  - img-src data:            : src/index.css uses an inline SVG data URI for the grain texture.
#  - To allow a new external origin later, add it to the single directive that needs it and update DEPLOY.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
