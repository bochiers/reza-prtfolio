# Included from every location that sets its own add_header.
# (nginx drops inherited add_header directives as soon as a location defines
#  one of its own, so the headers live in a snippet instead of the server block.)
#
# CSP decisions (also documented in docs/DEPLOY.md):
#  - script-src 'self'        : no inline script. JSON-LD (<script type="application/ld+json">)
#                               is a data block, not executed, so CSP does not apply to it.
#                               If frontend ever needs an inline executable script, add a sha256 hash
#                               here; do NOT use 'unsafe-inline' for scripts.
#  - style-src 'unsafe-inline': framer-motion writes inline style attributes at runtime.
#  - media-src / img-src      : hero video is hotlinked from d8j0ntlcm91z4.cloudfront.net (third party).
#                               Remove that origin once the video is self-hosted.
#  - fonts.googleapis.com / fonts.gstatic.com are allowed in case frontend loads Inter from Google Fonts.
#                               Currently src/index.css only names "Inter" (no @font-face / <link>), so
#                               these two origins are unused today; drop them if fonts stay local.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
