user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    access_log  /var/log/nginx/access.log;

    # gzip only: the stock nginx:alpine image has no brotli module.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        text/javascript application/xml application/rss+xml application/manifest+json
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        include /etc/nginx/snippets/security-headers.conf;

        # Liveness probe for Docker HEALTHCHECK / Dokploy.
        location = /healthz {
            access_log off;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite output: filenames are content-hashed, safe to cache forever.
        # A missing asset must 404, never fall back to index.html.
        location ^~ /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The HTML shell is never cached without revalidation, so a new
        # deploy (new hashed asset names) is picked up immediately.
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Other files from public/ (favicon, img/, robots.txt, ...). Not hashed,
        # so only a short cache. Missing file with an extension -> 404.
        location ~* \.(?:ico|svg|png|jpe?g|webp|avif|gif|woff2?|ttf|otf|mp4|webm|txt|xml|json|webmanifest|map)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # SPA fallback: /tentang, /pengalaman, ... -> index.html (served 200).
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
