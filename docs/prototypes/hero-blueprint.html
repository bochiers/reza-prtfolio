.bp-pilefill{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:bp-grow 9s cubic-bezier(.45,0,.55,1) var(--d) infinite}
.bp-auger{opacity:0;animation:bp-head 9s cubic-bezier(.45,0,.55,1) var(--d) infinite}
